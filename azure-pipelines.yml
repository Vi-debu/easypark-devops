trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self

- script: |
    echo "Iniciando pipeline EasyPark"
  displayName: 'Início'

- script: |
    docker --version
  displayName: 'Docker'

- script: |
    docker compose version || docker-compose --version
  displayName: 'Docker Compose'

- script: |
    ls
  displayName: 'Arquivos do Projeto'

- script: |
    echo "Build realizado"
    echo "Deploy realizado"
  displayName: 'CI/CD'

- script: |
    echo "Pipeline finalizada com sucesso"
  displayName: 'Final'