trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self

- script: |
    docker pull nginx
  displayName: 'Baixar imagem Docker'

- script: |
    docker run -d --name easypark-container -p 80:80 nginx
  displayName: 'Criar Container'

- script: |
    docker ps
  displayName: 'Container Rodando'

- script: |
    mkdir artifact
    echo "EasyPark deploy realizado com sucesso" > artifact/deploy.txt
  displayName: 'Criar Artifact'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'artifact'
    ArtifactName: 'easypark-artifact'
  displayName: 'Publicar Artifact'