trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  resourceGroup: EasyPark-RG
  plan: EasyPark-Plan
  webapp: easypark-webapp-88
  location: eastus

steps:

- task: AzureCLI@2
  inputs:
    azureSubscription: 'SUA-CONEXAO-AZURE'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az group create --name $(resourceGroup) --location $(location)

      az appservice plan create \
        --name $(plan) \
        --resource-group $(resourceGroup) \
        --sku B1 \
        --is-linux

      az webapp create \
        --name $(webapp) \
        --resource-group $(resourceGroup) \
        --plan $(plan) \
        --runtime "NODE|18-lts"