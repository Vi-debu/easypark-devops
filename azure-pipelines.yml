trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self

- script: |
    echo "Iniciando pipeline EasyPark"
  displayName: 'Início'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'SUA-CONEXAO-AZURE'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az group create --name easypark-rg --location brazilsouth

      az vm create \
        --resource-group easypark-rg \
        --name easypark-vm \
        --image Ubuntu2204 \
        --admin-username azureuser \
        --generate-ssh-keys

  displayName: 'Criar Máquina Virtual'

- script: |
    echo "VM criada com sucesso"
  displayName: 'Deploy'
