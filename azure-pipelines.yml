trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self

- script: |
    docker pull nginx
    docker run -d --name easypark-container -p 80:80 nginx
    docker ps
  displayName: 'Validar Ambiente e Container Local'

- script: |
    mkdir artifact
    echo "EasyPark deploy local simulado com sucesso" > artifact/deploy.txt
    echo "Ambiente de testes validado na esteira de integração." >> artifact/deploy.txt
  displayName: 'Gerar Manifesto de Sucesso'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'artifact'
    ArtifactName: 'easypark-artifact'
  displayName: 'Publicar Artifact'