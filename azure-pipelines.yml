trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self

- script: |
    docker pull nginx
  displayName: 'Baixar imagem'

- script: |
    docker run -d --name easypark-container -p 80:80 nginx
  displayName: 'Criar Container'

- script: |
    docker ps
  displayName: 'Container Rodando'