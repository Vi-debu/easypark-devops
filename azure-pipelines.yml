trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  resourceGroup: EasyParkRG
  plan: EasyParkPlan
  webapp: easyparkwebapp88
  location: eastus

steps:

- task: AzureCLI@2
  displayName: Criar Web App EasyPark
  inputs:
    azureSubscription: 'SUA-CONEXAO-AZURE'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      az group create \
        --name $(resourceGroup) \
        --location $(location)

      az appservice plan create \
        --name $(plan) \
        --resource-group $(resourceGroup) \
        --sku F1 \
        --is-linux

      az webapp create \
        --resource-group $(resourceGroup) \
        --plan $(plan) \
        --name $(webapp) \
        --runtime "PYTHON|3.11"

- script: |
    mkdir artifact
    echo "EasyPark criado com sucesso" > artifact/deploy.txt
  displayName: Criar Artifact

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: artifact
    ArtifactName: easypark-artifact