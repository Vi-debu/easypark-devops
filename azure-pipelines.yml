trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  resourceGroup: EasyPark-RG-2
  appServicePlan: EasyPark-Plan-2
  webAppName: easypark-webapp-99
  location: eastus

steps:

- task: AzureCLI@2
  displayName: Criar infraestrutura EasyPark
  inputs:
    azureSubscription: 'SUA-CONEXAO-AZURE'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -e

      az account show

      az group create -n $(resourceGroup) -l $(location)

      az appservice plan create \
        -n $(appServicePlan) \
        -g $(resourceGroup) \
        --sku B1 \
        --is-linux

      az webapp create \
        -n $(webAppName) \
        -g $(resourceGroup) \
        -p $(appServicePlan) \
        --runtime "NODE|18-lts"