trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self

- script: |
    echo "Iniciando pipeline EasyPark"
  displayName: 'Início'

- script: |
    docker --version
  displayName: 'Verificar Docker'

- script: |
    docker pull nginx
  displayName: 'Baixar imagem Docker'

- script: |
    docker run -d --name easypark-container -p 80:80 nginx
  displayName: 'Criar Container'

- script: |
    docker ps
  displayName: 'Verificar Container'

- script: |
    mkdir artefato
    echo "Deploy EasyPark realizado com sucesso" > artefato/deploy.txt
  displayName: 'Criar Artefato'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'artefato'
    ArtifactName: 'easypark-artifact'
  displayName: 'Publicar Artefato'

- script: |
    echo "Pipeline finalizada com sucesso"
  displayName: 'Finalização'