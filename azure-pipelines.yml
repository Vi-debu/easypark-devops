trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  resourceGroup: 'EasyPark-RG'
  servicePlan: 'EasyPark-Plan'
  webAppName: 'easypark-app-88'
  location: 'eastus'

steps:
- checkout: self

- task: AzureCLI@2
  displayName: 'Criar Infraestrutura no Azure (Web App)'
  inputs:
    azureSubscription: 'Sua-Conexao-Com-O-Azure'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az appservice plan create --name $(servicePlan) --resource-group $(resourceGroup) --sku B1 --is-linux --location $(location)
      az webapp create --name $(webAppName) --resource-group $(resourceGroup) --plan $(servicePlan) --deployment-container-image-name "nginx:latest"

- script: |
    mkdir artifact
    echo "EasyPark deploy realizado com sucesso" > artifact/deploy.txt
    echo "Seu app estará disponível em: https://$(webAppName).azurewebsites.net" >> artifact/deploy.txt
  displayName: 'Criar Informações do Deploy'

- task: PublishBuildArtifacts@1
  inputs:
    尋athtoPublish: 'artifact'
    ArtifactName: 'easypark-artifact'
  displayName: 'Publicar Artifact'
