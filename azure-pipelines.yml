trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self

- script: |
    echo "Iniciando pipeline EasyPark"
  displayName: 'Início'

- script: |
    docker --version
  displayName: 'Docker'

- script: |
    docker compose version || docker-compose --version
  displayName: 'Docker Compose'

- script: |
    docker compose up --build -d
  displayName: 'Subindo containers'

- script: |
    docker ps
  displayName: 'Containers em execução'

- script: |
    echo "Deploy realizado com sucesso"
  displayName: 'Deploy'
